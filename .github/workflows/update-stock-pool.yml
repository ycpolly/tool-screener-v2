name: Update Stock Pool

on:
  schedule:
    # 台灣時間 (UTC+8) 排程：
    - cron: '0 9 * * 1-5'    # 17:00 台灣時間（第一批：盤後三大法人、量大排行與 5 大選股模式）
    - cron: '0 11 * * 1-5'   # 19:00 台灣時間（第二批：分點明細出爐，抓取 1D/3D/5D 籌碼集中度與短沖避雷）
    - cron: '0 15 * * 1-5'   # 23:00 台灣時間（夜間最終確認，含完整籌碼）
  workflow_dispatch:          # 允許手動觸發
    inputs:
      with_chips:
        description: '是否抓取 1D/3D/5D 籌碼集中度與短沖避雷'
        required: false
        type: boolean
        default: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 需要寫入 public/data/stock-pool.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock pool update
        run: |
          if [ "${{ github.event.inputs.with_chips }}" = "false" ]; then
            python -m scripts.main
          else
            python -m scripts.main --with-chips
          fi


      - name: Commit updated stock-pool.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stock-pool.json
          git diff --cached --quiet || git commit -m "data: update stock-pool.json [$(date +'%Y-%m-%d %H:%M') CST]"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
