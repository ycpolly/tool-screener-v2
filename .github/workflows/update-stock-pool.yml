name: Update Stock Pool

on:
  schedule:
    # 台灣時間 (UTC+8) 兩波流排程（使用零散分鐘避開整點尖峰）：
    - cron: '46 9 * * 1-5'   # 17:46 台灣時間（第一批：盤後三大法人、量大排行與 5 大選股模式）
    - cron: '16 11 * * 1-5'  # 19:16 台灣時間（第二批：分點明細出爐，抓取 1D/3D/5D 籌碼集中度與短沖避雷）

  workflow_dispatch:          # 允許手動觸發
    inputs:
      with_chips:
        description: '是否抓取 1D/3D/5D 籌碼集中度與短沖避雷'
        required: false
        type: boolean
        default: true
      force:
        description: '是否強制執行（忽略深夜換日清算時段保護）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check execution time window (防幽靈排程時段攔截)
        id: time_check
        run: |
          # 盤後安全執行時段為台灣時間 16:30 ~ 22:30 (即 UTC 08:30 ~ 14:30)
          UTC_HOUR=$(date -u +%H)
          IS_SCHEDULE="${{ github.event_name == 'schedule' }}"
          IS_FORCE="${{ github.event.inputs.force == 'true' }}"

          echo "Current UTC Hour: $UTC_HOUR"
          echo "Event Name: ${{ github.event_name }}"
          echo "Force: $IS_FORCE"

          if [ "$IS_SCHEDULE" = "true" ]; then
            # schedule 排程若因 GitHub 隊列延遲拖到 UTC 15:00 ~ 08:00 (即台灣時間 23:00 ~ 16:00 次日)
            # 視為無效幽靈排程，為防止半夜 Yahoo Finance 換日清算空值污染資料庫，自動跳過本次執行
            if [ "$UTC_HOUR" -ge 15 ] || [ "$UTC_HOUR" -lt 8 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=Ghost Schedule Blocked::偵測到 GitHub Actions 隊列嚴重延遲之幽靈排程 (UTC: $(date -u +%H:%M))，落在非盤後安全窗口 (台灣時間 23:00 ~ 16:00)。自動跳過本次執行以確保資料庫安全！"
              exit 0
            fi
          elif [ "$IS_FORCE" != "true" ]; then
            # 手動或外部觸發若落在深夜 Yahoo 換日維護清算高風險期 (台灣時間 23:30 ~ 02:30，即 UTC 15:30 ~ 18:30)
            if [ "$UTC_HOUR" -ge 16 ] && [ "$UTC_HOUR" -le 18 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=Midnight Maintenance Risk::當前為深夜 Yahoo Finance 跨日清算高風險期 (UTC: $(date -u +%H:%M))，若需強制執行請於 workflow_dispatch 勾選 force: true。本次略過執行。"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.time_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock pool update
        if: steps.time_check.outputs.skip != 'true'
        run: |
          # 檢查當前時間：若為台灣時間 18:30 之後 (UTC 10:30 之後)，券商分點已結算完畢，一律啟用 --with-chips 抓取籌碼
          UTC_HOUR=$(date -u +%H)
          UTC_MIN=$(date -u +%M)
          CURRENT_MINUTES=$(( 10#$UTC_HOUR * 60 + 10#$UTC_MIN ))

          # UTC 10:30 = 630 分鐘 (對應台灣時間 18:30)
          if [ "${{ github.event.inputs.with_chips }}" = "false" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            # 僅在手動 workflow_dispatch 明確勾選 force 且指定 false 時，才允許手動跳過籌碼
            echo "[workflow] 手動強制指定無籌碼更新模式"
            python -m scripts.main
          elif [ "$CURRENT_MINUTES" -ge 630 ] || [ "${{ github.event.inputs.with_chips }}" = "true" ]; then
            # 晚上 18:30 以後 (含 19:16 第二波) 或明確指定 with_chips: 自動帶籌碼
            echo "[workflow] 觸發第二波完整更新模式（含 1D/3D/5D 籌碼集中度與短沖避雷）"
            python -m scripts.main --with-chips
          elif [ "$UTC_HOUR" = "09" ] || [ "${{ github.event.inputs.with_chips }}" = "false" ]; then
            # 第一波 17:46 (09:46 UTC)：券商分點尚未出爐，快速更新五大模式名單
            echo "[workflow] 觸發第一波快速更新模式（不含券商分點籌碼）"
            python -m scripts.main
          else
            echo "[workflow] 預設更新模式（含籌碼）"
            python -m scripts.main --with-chips
          fi

      - name: Commit and push updated stock-pool.json
        if: steps.time_check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stock-pool.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update stock-pool.json [$(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M') CST]"
            git push origin main
          fi

      - name: Setup Node.js
        if: steps.time_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.time_check.outputs.skip != 'true'
        run: npm ci

      - name: Build Web App
        if: steps.time_check.outputs.skip != 'true'
        run: npm run build

      - name: Upload artifact
        if: steps.time_check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.time_check.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
