name: Update Stock Pool

on:
  schedule:
    # 台灣時間 (UTC+8) 兩波流排程（提早出發並使用零散分鐘避開整點尖峰）：
    - cron: '38 8 * * 1-5'   # 16:38 台灣時間（第一批：盤後三大法人、量大排行與 5 大選股模式）
    - cron: '42 10 * * 1-5'  # 18:42 台灣時間（第二批：分點明細出爐，抓取 1D/3D/5D 籌碼集中度與短沖避雷）

  workflow_dispatch:          # 允許手動觸發
    inputs:
      with_chips:
        description: '是否抓取 1D/3D/5D 籌碼集中度與短沖避雷'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock pool update
        run: |
          if [ "${{ github.event.inputs.with_chips }}" = "false" ]; then
            python -m scripts.main
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" = "09" ]; then
            # 第一波 17:15 (09:15 UTC)：快速更新三大法人與五大模式名單
            python -m scripts.main
          else
            # 第二波 19:15 (11:15 UTC)：券商分點出爐，完整更新 1D/3D/5D 籌碼集中度與短沖避雷
            python -m scripts.main --with-chips
          fi

      - name: Commit and push updated stock-pool.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stock-pool.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update stock-pool.json [$(date +'%Y-%m-%d %H:%M') CST]"
            git push origin main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
