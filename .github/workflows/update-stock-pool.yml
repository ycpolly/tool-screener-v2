name: Update Stock Pool

on:
  schedule:
    # 台灣時間 (UTC+8) 三波流排程（使用零散分鐘避開整點尖峰）：
    - cron: '35 5 * * 1-5'   # 13:35 台灣時間（第零波：收盤快刷，掌握今日最新量價選股與 13:40 零股交易決策）
    - cron: '46 9 * * 1-5'   # 17:46 台灣時間（第一批：盤後三大法人、量大排行與 5 大選股模式）
    - cron: '16 11 * * 1-5'  # 19:16 台灣時間（第二批：分點明細出爐，抓取 1D/3D/5D 籌碼集中度與短沖避雷）

  workflow_dispatch:          # 允許手動觸發
    inputs:
      with_chips:
        description: '是否抓取 1D/3D/5D 籌碼集中度與短沖避雷'
        required: false
        type: boolean
        default: true
      force:
        description: '是否強制執行（忽略深夜換日清算時段保護）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check execution time window (防幽靈排程時段攔截)
        id: time_check
        run: |
          # 合法執行時段 (UTC 時區)：
          # 1. 收盤快刷窗口：UTC 05:30 ~ 07:00 (即台灣時間 13:30 ~ 15:00)
          # 2. 盤後主力窗口：UTC 08:30 ~ 14:30 (即台灣時間 16:30 ~ 22:30)
          UTC_HOUR=$(date -u +%H)
          UTC_MIN=$(date -u +%M)
          CURRENT_MINUTES=$(( 10#$UTC_HOUR * 60 + 10#$UTC_MIN ))
          IS_SCHEDULE="${{ github.event_name == 'schedule' }}"
          IS_FORCE="${{ github.event.inputs.force == 'true' }}"

          echo "Current UTC: $UTC_HOUR:$UTC_MIN (Minutes: $CURRENT_MINUTES)"
          echo "Event Name: ${{ github.event_name }}"
          echo "Force: $IS_FORCE"

          if [ "$IS_SCHEDULE" = "true" ]; then
            # 檢查 schedule 是否落在兩大合法安全窗口之一：
            # 窗口 A (收盤快刷): UTC 05:25 (325m) ~ 07:15 (435m)
            # 窗口 B (盤後主力): UTC 08:25 (505m) ~ 14:45 (885m)
            IN_WINDOW_A=0
            IN_WINDOW_B=0
            if [ "$CURRENT_MINUTES" -ge 325 ] && [ "$CURRENT_MINUTES" -le 435 ]; then
              IN_WINDOW_A=1
            fi
            if [ "$CURRENT_MINUTES" -ge 505 ] && [ "$CURRENT_MINUTES" -le 885 ]; then
              IN_WINDOW_B=1
            fi

            if [ "$IN_WINDOW_A" -eq 0 ] && [ "$IN_WINDOW_B" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=Ghost Schedule Blocked::偵測到 GitHub Actions 隊列嚴重延遲之幽靈排程 (UTC: $(date -u +%H:%M))，落在非安全窗口。自動跳過本次執行以確保資料庫安全！"
              exit 0
            fi
          elif [ "$IS_FORCE" != "true" ]; then
            # 手動或外部觸發若落在深夜 Yahoo 換日維護清算高風險期 (台灣時間 23:30 ~ 02:30，即 UTC 15:30 ~ 18:30)
            if [ "$UTC_HOUR" -ge 16 ] && [ "$UTC_HOUR" -le 18 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=Midnight Maintenance Risk::當前為深夜 Yahoo Finance 跨日清算高風險期 (UTC: $(date -u +%H:%M))，若需強制執行請於 workflow_dispatch 勾選 force: true。本次略過執行。"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.time_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock pool update
        if: steps.time_check.outputs.skip != 'true'
        run: |
          UTC_HOUR=$(date -u +%H)
          UTC_MIN=$(date -u +%M)
          CURRENT_MINUTES=$(( 10#$UTC_HOUR * 60 + 10#$UTC_MIN ))

          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          # UTC 10:30 = 630 分鐘 (對應台灣時間 18:30 券商分點出爐時段)
          if [ "${{ github.event.inputs.with_chips }}" = "false" ]; then
            echo "[workflow] 明確指定無籌碼快速更新模式"
            python -m scripts.main $FORCE_FLAG
          elif [ "$CURRENT_MINUTES" -ge 630 ] || [ "${{ github.event.inputs.with_chips }}" = "true" ]; then
            echo "[workflow] 觸發晚上完整更新模式（含 1D/3D/5D 籌碼集中度與短沖避雷）"
            python -m scripts.main --with-chips $FORCE_FLAG
          elif [ "$CURRENT_MINUTES" -lt 630 ]; then
            # 晚上 18:30 之前 (含 13:35 收盤快刷與 17:46 第一波)：分點尚未結算完畢，一律執行快速更新模式並啟用日期守門員
            echo "[workflow] 觸發收盤/第一波快速更新模式（不含券商分點籌碼，~45s 快速產出，附 Date Guard）"
            python -m scripts.main --check-date $FORCE_FLAG
          else
            echo "[workflow] 預設更新模式（含籌碼）"
            python -m scripts.main --with-chips $FORCE_FLAG
          fi

      - name: Commit and push updated stock-pool.json
        if: steps.time_check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stock-pool.json cache/fundamentals.json cache/revenue.json cache/industry.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update stock-pool.json, fundamentals, revenue and industry cache [$(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M') CST]"
            git push origin main
          fi

      - name: Setup Node.js
        if: steps.time_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.time_check.outputs.skip != 'true'
        run: npm ci

      - name: Build Web App
        if: steps.time_check.outputs.skip != 'true'
        run: npm run build

      - name: Upload artifact
        if: steps.time_check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.time_check.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
