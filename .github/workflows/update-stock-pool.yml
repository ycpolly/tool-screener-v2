name: Update Stock Pool

on:
  schedule:
    # 台灣時間 (UTC+8) 兩波流排程（避開整點尖峰）：
    - cron: '15 9 * * 1-5'   # 17:15 台灣時間（第一批：盤後三大法人、量大排行與 5 大選股模式）
    - cron: '15 11 * * 1-5'  # 19:15 台灣時間（第二批：分點明細出爐，抓取 1D/3D/5D 籌碼集中度與短沖避雷）


  workflow_dispatch:          # 允許手動觸發
    inputs:
      with_chips:
        description: '是否抓取 1D/3D/5D 籌碼集中度與短沖避雷'
        required: false
        type: boolean
        default: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 需要寫入 public/data/stock-pool.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock pool update
        run: |
          if [ "${{ github.event.inputs.with_chips }}" = "false" ]; then
            python -m scripts.main
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" = "09" ]; then
            # 第一波 17:15 (09:15 UTC)：快速更新三大法人與五大模式名單
            python -m scripts.main
          else
            # 第二波 19:15 (11:15 UTC)：券商分點出爐，完整更新 1D/3D/5D 籌碼集中度與短沖避雷
            python -m scripts.main --with-chips
          fi



      - name: Commit updated stock-pool.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stock-pool.json
          git diff --cached --quiet || git commit -m "data: update stock-pool.json [$(date +'%Y-%m-%d %H:%M') CST]"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
